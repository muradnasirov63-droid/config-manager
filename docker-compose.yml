services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: config
      POSTGRES_PASSWORD: config
      POSTGRES_DB: configs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U config -d configs"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - config-net

  api:
    build: .
    image: config-manager:latest
    environment:
      DATABASE_URL: postgresql+psycopg2://config:config@db:5432/configs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - config-net

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    networks:
      - config-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - config-net

volumes:
  pgdata:

networks:
  config-net:
